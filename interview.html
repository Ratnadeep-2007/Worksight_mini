<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Interview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0;
      background: #07080f;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
      position: relative;
    }
    
    /* Background Ambience */
    body::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, rgba(124,58,237,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .top-nav {
      position: absolute; top: 2rem; left: 2rem; z-index: 10;
    }
    .back-btn {
      color: #8b92b0; text-decoration: none; font-weight: 600;
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 1rem; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* The glowing bot orb */
    .orb-container {
      position: relative;
      width: 250px; height: 250px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 3rem;
    }
    .orb {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
      box-shadow: 0 0 40px rgba(124,58,237,0.6), inset 0 0 20px rgba(255,255,255,0.4);
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
      animation: float 4s ease-in-out infinite;
      z-index: 2;
    }
    .orb-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(6,182,212,0.5);
      animation: pulse-ring 2s infinite;
      z-index: 1;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .status-text {
      font-size: 1.5rem; font-weight: 800;
      letter-spacing: 1px; margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #a78bfa 0%, #22d3ee 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #8b92b0; font-size: 0.95rem; margin-bottom: 2rem; max-width: 400px; text-align: center; line-height: 1.5;
    }

    .controls { display: flex; gap: 1rem; }
    .btn {
      padding: 0.8rem 2rem; border-radius: 12px; border: none;
      font-family: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn-start {
      background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%); color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(124,58,237,0.6); }
    .btn-end {
      background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);
      display: none;
    }
    .btn-end:hover { background: rgba(239, 68, 68, 0.2); }

    /* States */
    .state-listening .orb { box-shadow: 0 0 60px rgba(6,182,212,0.8), inset 0 0 30px rgba(255,255,255,0.6); background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); }
    .state-speaking .orb { 
       box-shadow: 0 0 80px rgba(124,58,237,0.8), inset 0 0 40px rgba(255,255,255,0.8); 
       background: linear-gradient(135deg, #c026d3 0%, #7c3aed 100%); 
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Dashboard
    </a>
  </nav>

  <div class="orb-container" id="botOrb">
    <div class="orb-ring"></div>
    <div class="orb" id="orbCore"></div>
  </div>

  <div class="status-text" id="statusText">Ready for Interview</div>
  <p class="subtitle" id="subtitleText">Click start to connect with the AI Voice Interviewer.</p>

  <div class="controls">
    <button class="btn btn-start" id="startBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      Start Interview
    </button>
    <button class="btn btn-end" id="endBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
      End Call
    </button>
  </div>

  <script type="module" src="js/interview.js"></script>
</body>
</html>
